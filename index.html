<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101f25" />
    <meta name="description" content="Greywake — a free-roaming WWII submarine captain game. The ocean is yours." />
    <title>GREYWAKE — The ocean is yours</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23101f25'/%3E%3Cpath d='M4 19h24l-4 5H8zM14 12h6v7h-6zM17 7v5' fill='%23dbb67c' stroke='%23dbb67c'/%3E%3C/svg%3E" />
    <meta name="game-name" content="GREYWAKE" />
    <meta name="game-version" content="1.0.0" />
    <meta name="game-build" content="development" />
    <style id="boot-style">
      body { margin:0; background:#071015; }
      #boot-root { position:fixed; inset:0; z-index:2147483000; overflow:auto; box-sizing:border-box; padding:clamp(16px,4vw,40px); background:#071015; color:#d5e4dc; font:14px/1.6 ui-monospace,"Courier New",monospace; }
      #boot-root[hidden], #game-root[hidden] { display:none!important; }
      #boot-panel { max-width:760px; margin:auto; }
      #boot-root h1 { letter-spacing:0; font-weight:normal; font:inherit; font-size:18px; color:#b4d3bc; margin:0 0 20px; }
      #boot-root p, #boot-root dl { margin:12px 0; }
      #boot-root dl { display:grid; grid-template-columns:90px minmax(0,1fr); gap:4px 12px; }
      #boot-root dt { color:#94aaa4; } #boot-root dd { margin:0; overflow-wrap:anywhere; }
      #boot-progress { width:100%; height:10px; accent-color:#b4d3bc; }
      #boot-stages { list-style:none; padding:0; white-space:pre-wrap; }
      #boot-error { border-left:3px solid #f5b194; padding:12px; color:#f5b194; overflow-wrap:anywhere; }
      #boot-notes { white-space:pre-wrap; color:#a4b9b2; font-size:12px; }
      #boot-root button { font:inherit; font-size:12px; background:#152830; color:#d5e4dc; border:1px solid #526763; padding:8px 12px; margin:4px 4px 4px 0; cursor:pointer; }
      #boot-root button:focus-visible { outline:2px solid #f2ce8e; outline-offset:2px; }
      #boot-report { width:100%; box-sizing:border-box; min-height:180px; background:#0a191f; color:#d5e4dc; font:12px/1.5 monospace; }
      #boot-root [hidden] { display:none!important; }
    </style>
    <template id="game-style"><link rel="stylesheet" href="/src/style.css" /></template>
  </head>
  <body>
    <section id="boot-root" aria-label="Startup diagnostics"><div id="boot-panel">
      <h1 id="boot-brand">GREYWAKE / STARTUP</h1>
      <dl><dt>Version</dt><dd id="boot-version">1.0.0</dd><dt>Build</dt><dd id="boot-build">development</dd><dt>Platform</dt><dd id="boot-platform">Waiting for startup script</dd><dt>Renderer</dt><dd id="boot-renderer">Not selected</dd><dt>Adapter</dt><dd id="boot-adapter">Not available yet</dd></dl>
      <p id="boot-status" role="status" aria-live="polite">SCRIPT / Waiting / 0%</p>
      <progress id="boot-progress" max="100" value="0" aria-label="Startup progress"></progress>
      <p id="boot-error" role="alert" hidden></p><p id="boot-notes"></p>
      <div id="boot-actions" hidden><button id="boot-retry">Retry startup</button><button id="boot-webgl">Try WebGL 2</button><button id="boot-copy">Copy report</button><button id="boot-download">Download report</button><button id="boot-return" hidden>Return to game</button></div>
      <p id="boot-feedback" role="status"></p>
      <ul id="boot-stages" aria-label="Startup stages"></ul>
      <textarea id="boot-report" aria-label="Startup report" readonly hidden></textarea>
      <noscript><p>SYS-JS-OFF: JavaScript is disabled. Enable JavaScript to start the game. Version and build above identify this copy.</p></noscript>
    </div></section>
    <script src="/src/boot-sentinel.js"></script>
    <div id="game-root" hidden></div>
    <template id="game-ui">
    <canvas id="sea" aria-label="Interactive three-dimensional ocean" tabindex="0"></canvas>
    <div id="vignette"></div>
    <main id="launch" class="launch">
      <div class="launch-top"><span class="wordmark">GREYWAKE<span class="edition">NAVAL SANDBOX / 1942</span></span><span class="launch-coordinate">49°00′ N &nbsp; 17°00′ W</span></div>
      <div class="launch-copy"><p class="eyebrow"><span class="status-dot"></span> AN INDEPENDENT PATROL</p><h1>The ocean<br />is yours.</h1><p class="intro">A boat. A crew. An open horizon.<br />Hunt shipping. Survive the escorts. Build your command.</p><div class="launch-actions"><button id="begin" class="primary" disabled>Preparing the ocean…</button><button id="launch-orientation" class="secondary" disabled>Captain’s orientation</button><button id="launch-settings" class="ghost">Graphics & settings ↗</button></div><p id="loading-status" class="small-note">Initializing the renderer and physics</p></div>
      <div class="launch-footer"><span>FREE ROAM &nbsp; / &nbsp; NO MISSIONS &nbsp; / &nbsp; NO ORDERS</span><span id="renderer-badge">THREE.JS r186 · RAPIER 0.19.3</span></div>
    </main>
    <div id="hud" hidden>
      <header class="topbar"><div class="brand"><strong>GREYWAKE</strong><span id="region">NORTH ATLANTIC</span></div><div class="compass"><div class="compass-ticks">W &nbsp; · &nbsp; NW &nbsp; · &nbsp; N &nbsp; · &nbsp; NE &nbsp; · &nbsp; E</div><span id="heading">010°</span><span class="compass-pointer">▼</span></div><div class="career-bar"><button data-panel="captain" class="career-chip"><small>CAPTAIN</small><b id="level">LVL 1</b></button><button data-panel="refit" class="career-chip bounty"><small>BOUNTY</small><b id="bounty">1,800</b></button><button data-panel="settings" class="icon-button" aria-label="Open settings">⚙</button></div></header>
      <nav class="side-nav" aria-label="Command panels"><button data-panel="chart" title="World chart (M)"><span>⌖</span><small>CHART</small></button><button data-panel="captain" title="Captain skills (K)"><span>♜</span><small>CAPTAIN</small></button><button data-panel="crew" title="Crew & department heads"><span>♟</span><small>CREW</small></button><button data-panel="refit" title="Boat upgrades"><span>⚒</span><small>REFIT</small></button><button data-panel="log" title="Captain's log"><span>☷</span><small>LOG</small></button></nav>
      <section class="patrol-status"><div id="patrol-kind" class="eyebrow">U-96 / INDEPENDENT PATROL</div><div id="threat" class="quiet-status"><span class="status-dot"></span> Running undetected</div><div id="coordinates" class="mono">49°00′ N &nbsp; 17°00′ W</div></section>
      <button class="help-button" data-panel="manual" title="Field manual and guided orientation (H)">HELP <kbd>H</kbd></button>
      <button id="camera-mobile" class="mobile-camera-button" aria-label="Switch camera view">Camera</button>
      <section id="target-panel" class="target-panel"><div class="eyebrow">HYDROPHONE CONTACT</div><div class="contact-title"><b id="target-name">No contact selected</b><button id="cycle-target" class="icon-button" title="Next contact (Tab)" aria-label="Next contact">↻</button></div><div id="target-detail">Select a ship on the horizon</div><div class="target-hull"><span id="target-hull"></span></div><div id="solution" class="mono"></div><button id="focus-target" class="contact-focus">Look toward contact</button></section>
      <section id="intent-card" class="intent-card"><p class="eyebrow">CAPTAIN’S INTENT</p><h2 id="intent-title">Your first patrol</h2><p id="intent-copy">Find shipping, sink a merchant, break contact, and resupply.</p><button id="intent-action">Open world chart · M</button></section>
      <div id="labels"></div><button id="port-marker" class="port-marker" hidden></button><div id="periscope" hidden><div class="scope-cross"></div><span>PERISCOPE / OPTICAL BEARING</span></div>
      <section class="radar-block"><canvas id="radar" width="280" height="280" aria-label="Nearby ship radar"></canvas><div class="radar-label"><span id="contact-count">03 CONTACTS</span><button id="ping" title="Sonar ping (Q)">PING</button></div></section>
      <div class="sea-caption"><span class="small-note">SEA STATE</span><span id="sea-state">MODERATE SWELL</span><span class="caption-line"></span><button id="camera" class="ghost" title="Change camera (C)">CHASE VIEW ↻</button></div>
      <div class="combat-actions"><button id="torpedo" class="weapon primary"><span class="weapon-icon">⇢</span><span><b>Launch torpedo</b><small id="torpedo-status">14 READY</small></span><kbd>SPACE</kbd></button><button id="gun" class="weapon secondary"><span class="weapon-icon">⌁</span><span><b>Deck gun</b><small id="gun-status">80 SHELLS</small></span><kbd>F</kbd></button></div>
      <section class="bridge"><div class="instrument engine"><small>ENGINE TELEGRAPH</small><div class="instrument-value"><b id="speed">9.7</b><span>KN</span></div><div class="helm-input"><button id="slower" aria-label="Decrease throttle">−</button><input id="throttle" aria-label="Engine throttle" type="range" min="0" max="1" step="0.05" value="0.55" /><button id="faster" aria-label="Increase throttle">+</button></div></div><div class="instrument diving"><small>DEPTH CONTROL</small><div class="instrument-value"><b id="depth">0</b><span>M</span></div><div id="depth-order" class="depth-order" aria-live="polite">On the surface</div><div class="depth-buttons"><button data-depth="0" class="active" aria-label="Order surface, R">Surface</button><button data-depth="12" aria-label="Dive to periscope depth, 12 metres, V">Scope <span>12 m</span></button><button data-depth="80" aria-label="Dive deep, 80 metres, X">Dive <span>80 m</span></button></div></div><div class="instrument route-instrument"><small>NAVIGATION</small><button id="route-label" data-panel="chart">Set a destination <span>↗</span></button><div class="route-meta"><span id="route-distance">Open water · free helm</span><button id="autopilot">AUTO OFF</button></div></div><div class="instrument resources"><div class="resource"><span>HULL</span><div><i id="hull-bar"></i></div><b id="hull">100%</b></div><div class="resource"><span>DIESEL</span><div><i id="fuel-bar"></i></div><b id="fuel">100%</b></div><div class="resource"><span>BATTERY</span><div><i id="battery-bar"></i></div><b id="battery">100%</b></div><div class="resource"><span>O₂</span><div><i id="oxygen-bar"></i></div><b id="oxygen">100%</b></div></div><div class="instrument time"><small>TIME COMPRESSION</small><button id="time-cycle"><b id="time-value">1×</b><span>↻</span></button><button id="pause">Ⅱ PAUSE</button></div></section>
      <div class="helm-steer"><button id="port" aria-label="Steer port">◀</button><span>HELM</span><button id="starboard" aria-label="Steer starboard">▶</button></div>
      <footer class="hud-footer"><span id="patrol-time">PATROL DAY 01 · 16:24</span><span class="desktop-help">W / S ENGINE &nbsp; A / D RUDDER &nbsp; C CAMERA &nbsp; M CHART</span><span id="performance">60 FPS · WebGPU</span></footer>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <section id="ai-lab" aria-label="Enemy AI simulation and tuning lab" hidden></section>
    <div id="guide-highlight" hidden></div>
    <section id="guide" class="tutorial-guide" aria-label="Guided captain orientation" hidden><div class="guide-top"><span class="eyebrow">SAFE GUIDED PRACTICE</span><span id="guide-count" class="mono">1 / 15</span></div><h2 id="guide-heading"></h2><div class="guide-body"><p id="guide-copy"></p><p id="guide-report" role="status" aria-live="polite"></p><ul id="guide-tasks"></ul></div><div class="guide-actions"><button id="guide-next" class="primary">Next lesson</button><button id="guide-wait" class="secondary" hidden>Advance maneuver</button></div><div class="guide-bottom"><button id="guide-exit" class="ghost">Pause practice & return to patrol</button><span>Your career is protected</span></div><div class="guide-progress"><span id="guide-progress"></span></div></section>
    <div id="modal" class="modal-backdrop" hidden><section class="modal"><header class="modal-header"><div><p class="eyebrow" id="modal-eyebrow">U-96 / COMMAND</p><h2 id="modal-title">World chart</h2></div><button id="close-modal" class="icon-button" aria-label="Close panel">×</button></header><div id="modal-content"></div></section></div>
    <div id="loss" class="modal-backdrop" hidden><section class="loss-card"><p class="eyebrow">PRESSURE HULL LOST</p><h2>The sea keeps its due.</h2><p>The crew escaped. Salvage restores your boat at the nearest harbor for 25% of your bounty. Your captain, crew ranks, and refits carry on.</p><button id="salvage" class="primary">Recover the boat</button></section></div>
    </template>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
